<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Трамплин — знания становятся практикой</title>
  <desc id="desc">Учебная платформа колледжа ННГУ. Курсы, практика и AI-помощь. Справа — маршрут от урока через код к решению.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17181c"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1090 190) rotate(135) scale(460 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b7fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8a8f98" opacity=".17"/>
    </pattern>
  </defs>

  <rect x=".5" y=".5" width="1279" height="479" rx="24" fill="url(#background)" stroke="#26282e"/>
  <rect x="720" y="24" width="536" height="432" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="478" rx="24" fill="url(#glow)"/>

  <g transform="translate(56 48)" stroke="#4b93ff">
    <path d="M2.6 23.1C11 26.6 21 29.6 31 29.6C40 29 50.5 15 58 2.8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="7.6" cy="10.6" r="4.1" stroke-width="3.2"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="130" y="76" fill="#4b93ff" font-size="30" font-weight="600" letter-spacing="-1">трамплин</text>
    <text x="56" y="126" fill="#8a8f98" font-size="15" letter-spacing="2">УЧЕБНАЯ ПЛАТФОРМА · КОЛЛЕДЖ ННГУ</text>
    <text x="52" y="219" fill="#f2f3f5" font-size="64" font-weight="600" letter-spacing="-2.8">знания становятся</text>
    <text x="52" y="291" fill="#4b93ff" font-size="64" font-weight="600" letter-spacing="-2.8">практикой.</text>
    <text x="56" y="340" fill="#a4a9b3" font-size="21">От первого урока до работающего кода.</text>

    <rect x="56" y="389" width="115" height="38" rx="19" fill="#1f2127" stroke="#30333b"/>
    <circle cx="78" cy="408" r="4" fill="#4b93ff"/>
    <text x="93" y="414" fill="#d9dce2" font-size="16">курсы</text>
    <rect x="183" y="389" width="143" height="38" rx="19" fill="#1f2127" stroke="#30333b"/>
    <circle cx="205" cy="408" r="4" fill="#3ccbe3"/>
    <text x="220" y="414" fill="#d9dce2" font-size="16">практика</text>
    <rect x="338" y="389" width="161" height="38" rx="19" fill="#1f2127" stroke="#30333b"/>
    <circle cx="360" cy="408" r="4" fill="#b777f0"/>
    <text x="375" y="414" fill="#d9dce2" font-size="16">AI-помощь</text>

    <path d="M853 160V200Q853 216 869 216H1049Q1065 216 1065 232V266" stroke="#35445e" stroke-width="2"/>
    <path d="M1065 266V326Q1065 342 1049 342H909Q893 342 893 358V382" stroke="#35445e" stroke-width="2"/>
    <circle cx="962" cy="216" r="5" fill="#4b93ff"/>
    <circle cx="990" cy="342" r="5" fill="#30d158"/>

    <rect x="761" y="70" width="214" height="100" rx="16" fill="#17181c" stroke="#4b93ff" stroke-opacity=".7"/>
    <rect x="779" y="88" width="32" height="32" rx="10" fill="#16233a"/>
    <path d="M789 98H801M789 104H801M789 110H796" stroke="#4b93ff" stroke-width="2" stroke-linecap="round"/>
    <text x="824" y="110" fill="#f2f3f5" font-size="21" font-weight="600">изучай</text>
    <text x="780" y="146" fill="#8a8f98" font-size="15">уроки и карта курса</text>

    <rect x="958" y="232" width="230" height="96" rx="16" fill="#17181c" stroke="#34454b"/>
    <rect x="976" y="250" width="32" height="32" rx="10" fill="#153038"/>
    <path d="M985 259L991 266L985 273M994 273H1000" stroke="#3ccbe3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1021" y="273" fill="#f2f3f5" font-size="21" font-weight="600">пробуй</text>
    <text x="976" y="307" fill="#8a8f98" font-size="15">код и проверка решений</text>

    <rect x="786" y="370" width="254" height="68" rx="16" fill="#17181c" stroke="#294333"/>
    <circle cx="819" cy="404" r="15" fill="#142a1b"/>
    <path d="M812 404L817 409L826 399" stroke="#30d158" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="848" y="411" fill="#f2f3f5" font-size="21" font-weight="600">двигайся выше</text>
  </g>
</svg>
